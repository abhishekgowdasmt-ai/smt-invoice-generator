<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip Sheet Generator | SMT Portal</title>
    <meta name="robots" content="noindex,nofollow">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body style="background-color: var(--bg-main); min-height: 100vh;">
    <header class="admin-topnav">
        <div class="admin-topnav-inner">
            <a class="admin-brand" href="/admin">
                <span>
                    <strong>SMT Portal</strong>
                    <small>Trip sheets</small>
                </span>
            </a>
            <nav class="admin-nav">
                <a class="admin-nav-link" href="/admin/dispatch/">RAC Management</a>
                <a class="admin-nav-link" href="/admin#tracking">ETS</a>
                <a class="admin-nav-link" href="/admin#datasource">DataSource</a>
                <a class="admin-nav-link active" href="/admin/trips">Trip sheets</a>
                <a class="admin-nav-link" href="/admin/invoices/">Invoice generation</a>
            </nav>
        </div>
    </header>
    <main class="container" style="max-width: 640px; margin: 3rem auto; padding: 0 1.25rem;">
        <section class="service-card" style="background: var(--bg-surface); padding: 2rem; border-radius: 12px; box-shadow: var(--glow-shadow);">
            <h1 class="section-title" style="font-size: 1.75rem; color: var(--primary); margin-bottom: 0.5rem;">Trip sheet PDF generator</h1>
            <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Upload the Excel file used for trip sheets. The same generator as before builds the PDF.</p>
            {% if error %}
            <p style="color: #b42318; margin-bottom: 1rem;">{{ error }}</p>
            {% endif %}
            <form method="post" action="/admin/trips/generate" enctype="multipart/form-data">
                <label for="excel_file" style="display:block; font-weight: 650; margin-bottom: 0.5rem;">Excel file (.xlsx)</label>
                <input id="excel_file" name="excel_file" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" required style="margin-bottom: 1.25rem; width: 100%;">
                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">Generate trip sheets PDF</button>
            </form>
        </section>
    </main>
</body>
</html>
