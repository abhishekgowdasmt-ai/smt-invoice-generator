<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>WhatsApp booking capture</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>WhatsApp booking capture</h1>
    <p>Local only. Reads one WhatsApp group. Does not send messages.</p>
  </header>
  <section class="status" id="status"></section>
  <nav class="tabs">
    <button data-tab="bookings" class="is-on">New bookings</button>
    <button data-tab="review">Review queue</button>
  </nav>
  <section id="bookings" class="panel"></section>
  <section id="review" class="panel hidden"></section>
  <script>
    const $ = (id) => document.getElementById(id)
    async function loadStatus() {
      const s = await fetch('/api/status').then((r) => r.json())
      $('status').innerHTML = `
        <div><b>WhatsApp</b><span class="${s.whatsapp}">${s.whatsapp}</span></div>
        <div><b>Target group</b><span>${s.target_group} · ${s.group_name || 'not set'}</span></div>
        <div><b>Last image</b><span>${s.last_image || '—'}</span></div>
        <div><b>Images processed</b><span>${s.images_processed}</span></div>
        <div><b>Bookings created</b><span>${s.bookings_created}</span></div>
        <div><b>Bookings updated</b><span>${s.bookings_updated}</span></div>
        <div><b>Duplicates</b><span>${s.duplicates}</span></div>
        <div><b>Review required</b><span>${s.review_required}</span></div>
        <div><b>Last error</b><span>${s.last_error || '—'}</span></div>`
    }
    async function loadBookings() {
      const data = await fetch('/api/bookings').then((r) => r.json())
      const rows = data.data || []
      $('bookings').innerHTML = rows.length ? `<table>
        <tr><th>Booking ID</th><th>Type</th><th>Cab</th><th>Date</th><th>Time</th><th>Address</th><th>Confidence</th><th>Status</th></tr>
        ${rows.map((r) => `<tr>
          <td>${r.booking_id || ''}</td><td>${r.booking_type || ''}</td><td>${r.cab_type || ''}</td>
          <td>${r.trip_date || ''}</td><td>${r.trip_time || ''}</td><td>${r.planned_start_address || ''}</td>
          <td>${r.confidence || ''}</td><td>${r.status || ''}</td>
        </tr>`).join('')}</table>` : '<p>No captured bookings yet.</p>'
    }
    async function loadReview() {
      const data = await fetch('/api/review').then((r) => r.json())
      const rows = data.data || []
      $('review').innerHTML = rows.length ? rows.map((r) => {
        const p = r.payload || {}
        const img = (r.image_path || '').split(/[/\\\\]/).pop()
        return `<article class="review-card">
          ${img ? `<img src="/images/${img}" alt="source">` : ''}
          <div>
            <p class="reason">${r.reason || ''}</p>
            <label>Booking ID <input data-id="${r.id}" name="booking_id" value="${p.booking_id || ''}"></label>
            <label>Type <input data-id="${r.id}" name="booking_type" value="${p.booking_type || ''}"></label>
            <label>Cab <input data-id="${r.id}" name="cab_type" value="${p.cab_type || ''}"></label>
            <label>Date <input data-id="${r.id}" name="trip_date" value="${p.trip_date || ''}"></label>
            <label>Time <input data-id="${r.id}" name="trip_time" value="${p.trip_time || ''}"></label>
            <label>Address <input data-id="${r.id}" name="planned_start_address" value="${p.planned_start_address || ''}"></label>
            <button onclick="approve(${r.id})">Approve</button>
            <button class="ghost" onclick="reject(${r.id})">Reject</button>
          </div>
        </article>`
      }).join('') : '<p>Review queue is empty.</p>'
    }
    function fields(id) {
      const out = {}
      document.querySelectorAll(`input[data-id="${id}"]`).forEach((el) => { out[el.name] = el.value })
      return out
    }
    async function approve(id) {
      const res = await fetch(`/api/review/${id}/approve`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(fields(id)) })
      const data = await res.json()
      if (!data.success) { alert(data.message); return }
      loadAll()
    }
    async function reject(id) {
      await fetch(`/api/review/${id}/reject`, { method: 'POST' })
      loadAll()
    }
    document.querySelectorAll('.tabs button').forEach((btn) => {
      btn.onclick = () => {
        document.querySelectorAll('.tabs button').forEach((b) => b.classList.remove('is-on'))
        btn.classList.add('is-on')
        $('bookings').classList.toggle('hidden', btn.dataset.tab !== 'bookings')
        $('review').classList.toggle('hidden', btn.dataset.tab !== 'review')
      }
    })
    async function loadAll() {
      await loadStatus()
      await loadBookings()
      await loadReview()
    }
    loadAll()
    setInterval(loadAll, 8000)
  </script>
</body>
</html>
